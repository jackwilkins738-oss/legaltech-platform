services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: legaltech
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: legaltech
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaltech -d legaltech"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - legaltech_pg:/var/lib/postgresql/data
volumes:
  legaltech_pg:
