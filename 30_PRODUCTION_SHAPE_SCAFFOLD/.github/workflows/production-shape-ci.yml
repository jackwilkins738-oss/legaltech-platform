name: Production Shape CI

on:
  pull_request:
  push:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 30_PRODUCTION_SHAPE_SCAFFOLD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
