name: Security Code Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep Community Edition
        run: python -m pip install semgrep==1.180.0
      - name: Verify scanner blocks known insecure fixtures
        run: python 32_SECURITY_REGRESSION_AUTOMATION/verify_semgrep.py
      - name: Scan source with reviewed local rules
        env:
          SCAN_LANGUAGE: ${{ matrix.language }}
          SEMGREP_SEND_METRICS: 'off'
        run: |
          if [ "$SCAN_LANGUAGE" = python ]; then
            semgrep scan --config 32_SECURITY_REGRESSION_AUTOMATION/semgrep/ci-rules.json --include '**/*.py' --metrics=off --disable-version-check --error --strict .
          else
            semgrep scan --config 32_SECURITY_REGRESSION_AUTOMATION/semgrep/ci-rules.json --include '**/*.js' --include '**/*.mjs' --include '**/*.cjs' --include '**/*.ts' --metrics=off --disable-version-check --error --strict .
          fi
