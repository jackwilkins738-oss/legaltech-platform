name: security-regression
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 32_SECURITY_REGRESSION_AUTOMATION/security_regression_scan.py
