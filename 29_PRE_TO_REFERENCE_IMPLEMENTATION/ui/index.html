<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legal Ops Review Queue</title>
<style>body{font:15px system-ui;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:1050px;margin:40px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.card{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:12px 0}button{padding:9px 12px;border:1px solid #aab6c5;border-radius:8px;background:#fff;cursor:pointer}button.primary{background:#17365d;color:white;border-color:#17365d}.muted{color:#65758b}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f7;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f9fb;padding:10px;border-radius:8px}input{padding:8px;border:1px solid #b8c1cd;border-radius:7px}</style></head>
<body><div class="wrap"><header><div><h1>Inbound Review Queue</h1><div class="muted">Synthetic local reference UI — no production auth</div></div><div><label>Tenant <input id="tenant" value="tenant-a"></label> <button onclick="load()">Refresh</button></div></header><div id="summary" class="card"></div><div id="items"></div></div>
<script>
async function api(p,o={}){o.headers={...(o.headers||{}),'x-tenant-id':document.getElementById('tenant').value,'content-type':'application/json'};const r=await fetch(p,o);return {status:r.status,data:await r.json()}}
async function load(){const r=await api('/api/v1/exceptions');document.getElementById('summary').textContent=`Open review items: ${r.data.items.filter(x=>x.status==='OPEN').length}`;document.getElementById('items').innerHTML=r.data.items.map(x=>`<div class="card"><div><span class="pill">${x.type}</span> <strong>${x.reason}</strong></div><div class="muted">${x.id}</div><pre>${JSON.stringify(x,null,2)}</pre>${x.status==='OPEN'?`<button class="primary" onclick="resolveItem('${x.id}')">Resolve without matter</button>`:''}</div>`).join('')||'<div class="card muted">No exceptions.</div>'}
async function resolveItem(id){await api(`/api/v1/exceptions/${id}/resolve`,{method:'POST',body:JSON.stringify({resolution:'REVIEWED_IN_REFERENCE_UI'})});await load()}load();
</script></body></html>
